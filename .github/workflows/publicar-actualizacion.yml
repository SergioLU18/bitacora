name: Publicar actualización en vivo

# Cada push a main compila la web y la publica como release de GitHub.
# La app instalada en iOS la descarga sola (src/lib/actualizaciones.ts).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-actualizacion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Número de build
        run: echo "BITACORA_BUILD=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: ¿Ya publicado?
        id: existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "web-$BITACORA_BUILD" > /dev/null 2>&1; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.existe.outputs.si != 'true'
        # .env no se versiona: los valores (públicos por diseño) viven en los secretos del repositorio.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" -a -n "$VITE_SUPABASE_PUBLISHABLE_KEY" \
            || { echo "Faltan los secretos VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          npm run build

      - name: Empaquetar
        if: steps.existe.outputs.si != 'true'
        run: |
          mkdir -p release
          (cd dist && zip -qr ../release/bundle.zip .)
          node scripts/manifiesto-actualizacion.mjs release/bundle.zip \
            "https://github.com/${{ github.repository }}/releases/download/web-$BITACORA_BUILD/bundle.zip" \
            release/latest.json

      - name: Publicar release
        if: steps.existe.outputs.si != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "web-$BITACORA_BUILD" release/bundle.zip release/latest.json \
            --title "Web $BITACORA_BUILD ($(git rev-parse --short HEAD))" \
            --notes "$(git log -1 --format=%s)" \
            --latest
